# ================================================================
# PRACTICAS EMPRESARIALES CUE - Configuracion Principal
# ================================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# ----------------------------------------------------------------
# SERVIDOR
# ----------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/api

# ----------------------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ----------------------------------------------------------------
# JWT
# ----------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------
# CORREO
# ----------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.h2.console.enabled=false

app.mail.from.name=Sistema Practicas CUE
app.mail.from.address=${SPRING_MAIL_USERNAME}

# ----------------------------------------------------------------
# CORS
# ----------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ----------------------------------------------------------------
# MULTIPART / UPLOADS
# ----------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ----------------------------------------------------------------
# JACKSON — fechas como ISO strings (no arrays)
# ----------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ----------------------------------------------------------------
# SISTEMA
# ----------------------------------------------------------------
app.nombre=Sistema de Gestion de Practicas Empresariales
app.universidad=Universidad Alexander Von Humboldt

# ----------------------------------------------------------------
# USUARIO ADMINISTRADOR INICIAL
# ----------------------------------------------------------------
app.init.admin.correo=dti@cue.edu.co
app.init.admin.password=${APP_INIT_ADMIN_PASSWORD}
app.init.crear.coordinador.test=false
app.init.coordinador.test.password=
